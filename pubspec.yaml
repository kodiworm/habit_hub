name: habit_hub
description: "Track and manage your habits to improve your lifestyle with Habits Hub"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.0-42.1.beta <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  theme:
    path: theme
  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.3
  flutter_localizations:
    sdk: flutter
  intl: any
  hive_flutter: ^1.1.0
  flex_color_scheme: ^7.3.1
  sign_button: ^2.0.5
  get_it: ^7.6.0
  formz: ^0.4.1
  flutter_svg: ^1.0.3
  http: ^1.1.0
  go_router: ^10.1.2
  table_calendar: ^3.0.9
  bloc: ^8.1.2
  confetti: ^0.7.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  hive: ^2.2.3
  hive_generator: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.2
  json_serializable: ^6.7.1
  flutter_gen: ^5.8.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/logos/

  fonts:
    - family: Oxygen
      fonts:
        - asset: assets/fonts/Oxygen-Light.ttf
          weight: 300
        - asset: assets/fonts/Oxygen-Regular.ttf
        - asset: assets/fonts/Oxygen-Bold.ttf
          weight: 700

    - family: MontserratAlternates
      fonts:
        - asset: assets/fonts/MontserratAlternates-Light.ttf
          weight: 300
        - asset: assets/fonts/MontserratAlternates-Regular.ttf
        - asset: assets/fonts/MontserratAlternates-Bold.ttf
          weight: 700
